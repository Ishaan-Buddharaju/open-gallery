<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>justify.js harness</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #1a1a1a;
    color: #e0e0e0;
    font-family: system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }

  .controls {
    flex: none;
    display: flex;
    gap: 8px;
    padding: 12px 16px;
    background: #222;
    border-bottom: 1px solid #444;
    align-items: center;
    flex-wrap: wrap;
  }
  .controls button {
    padding: 6px 14px;
    background: #333;
    color: #e0e0e0;
    border: 1px solid #555;
    border-radius: 4px;
    cursor: pointer;
    font-size: 13px;
  }
  .controls button:hover { background: #444; }
  .controls button.active { background: #506050; border-color: #7a7; }
  .controls .info {
    margin-left: auto;
    font-size: 13px;
    color: #999;
    font-variant-numeric: tabular-nums;
  }
  .controls select {
    padding: 4px 8px;
    background: #333;
    color: #e0e0e0;
    border: 1px solid #555;
    border-radius: 4px;
    font-size: 13px;
  }

  .canvas-wrap {
    flex: 1;
    position: relative;
    overflow: hidden;
  }
  .canvas {
    position: absolute;
    inset: 0;
  }
  .frame {
    position: absolute;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-family: monospace;
    color: rgba(0,0,0,0.7);
    overflow: hidden;
    will-change: transform, opacity;
  }
  .frame-label {
    text-align: center;
    line-height: 1.3;
    pointer-events: none;
  }

  @media (prefers-reduced-motion: reduce) {
    .frame { transition: none !important; }
  }
</style>
</head>
<body>

<div class="controls">
  <button id="btn-add">+ Add</button>
  <button id="btn-remove">- Remove</button>
  <button id="btn-reset">Reset (14)</button>
  <span>|</span>
  <button id="btn-cycle">Cycle</button>
  <label>Speed:
    <select id="cycle-speed">
      <option value="4000">Slow (4s)</option>
      <option value="2500" selected>Normal (2.5s)</option>
      <option value="1200">Fast (1.2s)</option>
    </select>
  </label>
  <span>|</span>
  <label>Preset:
    <select id="preset">
      <option value="mixed" selected>Mixed (14)</option>
      <option value="hostile">Hostile trio</option>
      <option value="panoramas">Panoramas + portraits</option>
      <option value="all-portrait">All portrait (8)</option>
      <option value="all-landscape">All landscape (8)</option>
      <option value="single">Single image</option>
    </select>
  </label>
  <label>Gutter:
    <select id="gutter-select">
      <option value="0">0</option>
      <option value="4">4</option>
      <option value="8" selected>8</option>
      <option value="12">12</option>
    </select>
  </label>
  <span class="info" id="info"></span>
</div>

<div class="canvas-wrap">
  <div class="canvas" id="canvas"></div>
</div>

<script type="module">
import { justify } from './justify.js';

const COLORS = [
  '#e07050','#50a0d0','#70c070','#d0a040','#a070c0',
  '#d06080','#50b0a0','#c08040','#6080d0','#b0b050',
  '#d07090','#40a0a0','#c06060','#80a060',
];

const POOL = [
  { id: 's1',  aspect: 0.75 },
  { id: 's2',  aspect: 1.333 },
  { id: 's3',  aspect: 1.777 },
  { id: 's4',  aspect: 0.5625 },
  { id: 's5',  aspect: 1.0 },
  { id: 's6',  aspect: 1.333 },
  { id: 's7',  aspect: 0.75 },
  { id: 's8',  aspect: 2.0 },
  { id: 's9',  aspect: 0.75 },
  { id: 's10', aspect: 1.5 },
  { id: 's11', aspect: 1.0 },
  { id: 's12', aspect: 0.667 },
  { id: 's13', aspect: 1.333 },
  { id: 's14', aspect: 1.777 },
  { id: 's15', aspect: 0.5625 },
  { id: 's16', aspect: 3.0 },
  { id: 's17', aspect: 0.75 },
  { id: 's18', aspect: 1.0 },
];

const PRESETS = {
  mixed:          POOL.slice(0, 14),
  hostile:        [{ id: 'pano', aspect: 3.5 }, { id: 'tall', aspect: 0.5625 }, { id: 'sq', aspect: 1.0 }],
  panoramas:      [
    { id: 'p1', aspect: 0.75 }, { id: 'p2', aspect: 0.75 }, { id: 'p3', aspect: 0.75 },
    { id: 'p4', aspect: 3.5 },  { id: 'p5', aspect: 0.75 }, { id: 'p6', aspect: 0.75 },
    { id: 'p7', aspect: 0.75 }, { id: 'p8', aspect: 0.75 },
  ],
  'all-portrait':  Array.from({ length: 8 }, (_, i) => ({ id: `pt${i}`, aspect: 0.75 })),
  'all-landscape': Array.from({ length: 8 }, (_, i) => ({ id: `ls${i}`, aspect: 1.5 })),
  single:          [{ id: 'solo', aspect: 1.333 }],
};

let items = [...PRESETS.mixed];
let addCounter = 100;

const debug = new URLSearchParams(location.search).has('debug');
const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

const STAGGER_PER_ROW = 80;
const STAGGER_CAP = 320;
const ANIM_DURATION = 900;
const ENTER_DURATION = 700;
const EXIT_DURATION = 400;

// ── DOM element pool keyed by item id ──────────────────────────────────

const frameMap = new Map();

function getColor(id) {
  let h = 0;
  for (let i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) | 0;
  return COLORS[((h % COLORS.length) + COLORS.length) % COLORS.length];
}

function getGutter() {
  return parseInt(document.getElementById('gutter-select').value, 10);
}

// ── FLIP render ────────────────────────────────────────────────────────

function render(animate = true) {
  const canvas = document.getElementById('canvas');
  const width = canvas.clientWidth;
  const height = canvas.clientHeight;
  if (width === 0 || height === 0) return;

  const gutter = getGutter();
  const t0 = performance.now();
  const result = justify(items, { width, height, gutter });
  const dt = performance.now() - t0;

  // F — snapshot First positions of existing frames
  const first = new Map();
  for (const [id, el] of frameMap) {
    first.set(id, { x: parseFloat(el.style.left), y: parseFloat(el.style.top),
                    w: parseFloat(el.style.width), h: parseFloat(el.style.height) });
  }

  // Build set of ids in new layout
  const newIds = new Set();
  const rowIndex = new Map();
  for (let ri = 0; ri < result.rows.length; ri++) {
    for (const it of result.rows[ri].items) {
      newIds.add(it.id);
      rowIndex.set(it.id, ri);
    }
  }

  // Remove frames not in new layout (exit animation)
  for (const [id, el] of frameMap) {
    if (!newIds.has(id)) {
      if (animate && !reducedMotion) {
        const anim = el.animate([
          { opacity: 1, transform: 'scale(1)' },
          { opacity: 0, transform: 'scale(0.88)' },
        ], { duration: EXIT_DURATION, easing: 'cubic-bezier(0.4, 0, 1, 1)' });
        anim.onfinish = () => el.remove();
      } else {
        el.remove();
      }
      frameMap.delete(id);
    }
  }

  // L — set Last positions, create new elements as needed
  for (const row of result.rows) {
    for (const it of row.items) {
      let el = frameMap.get(it.id);
      const isNew = !el;

      if (isNew) {
        el = document.createElement('div');
        el.className = 'frame';
        el.dataset.id = it.id;
        el.style.background = getColor(it.id);
        frameMap.set(it.id, el);
        canvas.appendChild(el);
      }

      el.style.left = it.x + 'px';
      el.style.top = it.y + 'px';
      el.style.width = it.w + 'px';
      el.style.height = it.h + 'px';

      const ar = it.w / it.h;
      const inputItem = items.find(i => i.id === it.id);
      const inputAR = inputItem ? inputItem.aspect.toFixed(3) : '?';
      el.innerHTML = `<div class="frame-label">${it.id}<br>${Math.round(it.w)}×${Math.round(it.h)}<br>ar ${ar.toFixed(2)}<br>in ${inputAR}</div>`;

      if (animate && !reducedMotion) {
        const ri = rowIndex.get(it.id) || 0;
        const stagger = Math.min(ri * STAGGER_PER_ROW, STAGGER_CAP);

        if (isNew) {
          el.animate([
            { opacity: 0, transform: 'scale(0.88)' },
            { opacity: 1, transform: 'scale(1)' },
          ], {
            duration: ENTER_DURATION,
            delay: stagger,
            easing: 'cubic-bezier(0.0, 0.0, 0.2, 1)',
            fill: 'backwards',
          });
        } else if (first.has(it.id)) {
          const f = first.get(it.id);
          const dx = f.x - it.x;
          const dy = f.y - it.y;
          const sx = f.w / it.w;
          const sy = f.h / it.h;

          if (Math.abs(dx) > 0.5 || Math.abs(dy) > 0.5 || Math.abs(sx - 1) > 0.01 || Math.abs(sy - 1) > 0.01) {
            el.animate([
              { transform: `translate(${dx}px, ${dy}px) scale(${sx}, ${sy})` },
              { transform: 'translate(0,0) scale(1,1)' },
            ], {
              duration: ANIM_DURATION,
              delay: stagger,
              easing: 'cubic-bezier(0.22, 1, 0.36, 1)',
              fill: 'backwards',
            });
          }
        }
      }
    }
  }

  const info = document.getElementById('info');
  const extra = debug ? ` · layout ${dt.toFixed(2)}ms` : '';
  info.textContent = `${items.length} items · ${result.rows.length} rows · ${width}×${height}${extra}`;
}

// ── Cycle mode ─────────────────────────────────────────────────────────

let cycleTimer = null;
let cyclePhase = 0;

const CYCLE_SEQUENCES = [
  // Start with full 14, remove down to 3, build back up with different items
  () => {
    // Remove 2 random items from the middle
    if (items.length > 3) {
      const idx = 1 + Math.floor(Math.random() * (items.length - 2));
      items.splice(idx, 1);
      render(true);
    }
  },
  () => {
    // Add an item from the pool that's not currently shown
    const currentIds = new Set(items.map(i => i.id));
    const available = POOL.filter(p => !currentIds.has(p.id));
    if (available.length > 0 && items.length < 12) {
      const pick = available[Math.floor(Math.random() * available.length)];
      const pos = Math.floor(Math.random() * (items.length + 1));
      items.splice(pos, 0, { ...pick });
      render(true);
    }
  },
];

function cycleStep() {
  const speed = parseInt(document.getElementById('cycle-speed').value, 10);
  cyclePhase++;

  // Alternate between remove and add phases, with some randomness
  if (items.length <= 3) {
    // At minimum — only add
    CYCLE_SEQUENCES[1]();
  } else if (items.length >= 12) {
    // At maximum — only remove
    CYCLE_SEQUENCES[0]();
  } else if (cyclePhase % 5 === 0) {
    // Every 5th step, swap: remove one and add a different one
    CYCLE_SEQUENCES[0]();
    setTimeout(() => CYCLE_SEQUENCES[1](), speed * 0.4);
  } else {
    // Random add or remove
    CYCLE_SEQUENCES[Math.random() < 0.5 ? 0 : 1]();
  }

  cycleTimer = setTimeout(cycleStep, speed);
}

function toggleCycle() {
  const btn = document.getElementById('btn-cycle');
  if (cycleTimer) {
    clearTimeout(cycleTimer);
    cycleTimer = null;
    btn.classList.remove('active');
    btn.textContent = 'Cycle';
  } else {
    btn.classList.add('active');
    btn.textContent = 'Stop';
    cyclePhase = 0;
    cycleStep();
  }
}

// ── Controls ───────────────────────────────────────────────────────────

document.getElementById('btn-add').addEventListener('click', () => {
  const aspects = [0.5625, 0.667, 0.75, 1.0, 1.333, 1.5, 1.777, 2.0, 3.0];
  const a = aspects[Math.floor(Math.random() * aspects.length)];
  items.push({ id: `add-${addCounter++}`, aspect: a });
  render(true);
});

document.getElementById('btn-remove').addEventListener('click', () => {
  if (items.length > 1) {
    items.pop();
    render(true);
  }
});

document.getElementById('btn-reset').addEventListener('click', () => {
  items = [...PRESETS.mixed];
  document.getElementById('preset').value = 'mixed';
  render(true);
});

document.getElementById('btn-cycle').addEventListener('click', toggleCycle);

document.getElementById('preset').addEventListener('change', (e) => {
  if (cycleTimer) toggleCycle();
  items = [...PRESETS[e.target.value]];
  render(true);
});

document.getElementById('gutter-select').addEventListener('change', () => render(true));
document.getElementById('cycle-speed').addEventListener('change', () => {
  if (cycleTimer) {
    clearTimeout(cycleTimer);
    cycleTimer = setTimeout(cycleStep, parseInt(document.getElementById('cycle-speed').value, 10));
  }
});

window.addEventListener('resize', () => render(false));
requestAnimationFrame(() => render(false));
</script>
</body>
</html>
